
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="Create your TrackBus student account.">

  <title>Student Register — TrackBus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script type="module" src="js/register.js"></script>
</head>

<body class="auth-page">
  <main class="auth-layout">
    <a class="brand auth-brand" href="index.html" aria-label="TrackBus home">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5 17.5V7.8C5 5.7 6.8 4 9 4h6c2.2 0 4 1.7 4 3.8v9.7"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 17.5h16l-1.5 3H5.5L4 17.5Z" fill="currentColor"/>
          <path d="M7 9h10v5H7z" fill="currentColor" opacity=".35"/>
        </svg>
      </span>
      <span class="brand-name">Track<span>Bus</span></span>
    </a>

    <section class="auth-card" aria-labelledby="registerTitle">
      <div class="auth-heading">
        <span class="section-label">YOUR CAMPUS JOURNEY STARTS HERE</span>
        <h1 id="registerTitle">Create your <span>account.</span></h1>
        <p>Register as a student to get started with TrackBus.</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">College email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@college.edu"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="studentId">Student ID / Enrollment number</label>
          <input
            type="text"
            id="studentId"
            name="studentId"
            placeholder="Enter your student ID"
            autocomplete="off"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="8"
            required
          >
          <span class="field-hint">Use at least 8 characters.</span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Enter your password again"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <p id="registerMessage" class="auth-message" role="status" aria-live="polite"></p>

        <button type="submit" class="button button-primary auth-submit">
          Create account
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="login.html">Sign in</a>
      </p>
    </section>

    <p class="auth-footer">TrackBus · Smarter campus mobility</p>
  </main>
</body>
</html>
