<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Track college bus locations and routes.">
    <title>TrackBus</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  <body>
    <main>
      <h1>TrackBus</h1>
      <p id="service-status" role="status">Bus tracking dashboard starter</p>
      <section aria-labelledby="buses-heading">
        <h2 id="buses-heading">Buses</h2>
        <div id="bus-list" aria-live="polite">No bus data loaded.</div>
      </section>
      <section aria-labelledby="map-heading">
        <h2 id="map-heading">Map</h2>
        <div id="map" role="region" aria-label="Bus map">Map integration pending.</div>
      </section>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
